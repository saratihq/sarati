name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes the run in flight; main is never cancelled so its history stays complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orchestr
          POSTGRES_PASSWORD: orchestr
          POSTGRES_DB: orchestr_svc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orchestr" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # DATABASE_URL is deliberately unset: the suites then resolve it exactly as a contributor's
      # machine does, so a default that no documented setup creates fails here instead of only there.
      PGBOSS_ENABLED: 'false'
      # NEXT_PUBLIC_* are inlined by `next build` and the client refuses to build without them,
      # rather than silently baking in a dev host. `same-origin` is what the image ships.
      NEXT_PUBLIC_API_URL: same-origin
      NEXT_PUBLIC_AGENT_URL: same-origin
    steps:
      - uses: actions/checkout@v4
      # No `version:` — the root package.json's `packageManager` field is the one source,
      # and specifying both makes the action refuse.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One gate for the whole workspace: lint, format, types, the open-core boundary
      # (core must never import apps/service/src/ee), unit and e2e for every package.
      - run: pnpm check

  # Proves the stack still comes up, which a per-image build cannot: the compose file, the
  # proxy routing and the shared SECRET_KEY between service and agent are only exercised together.
  # Publishing lives in release.yml, driven by a version tag.
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every image builds from the workspace root — the lockfile lives there, so a package
      # cannot be built from its own directory.
      - run: |
          for app in service client agent; do
            docker build -f "apps/$app/Dockerfile" -t "ghcr.io/saratihq/sarati-$app:latest" .
          done
      - run: |
          cat > .env <<EOF
          SECRET_KEY=$(openssl rand -base64 36 | tr '+/' '-_')
          FERNET_KEY=$(openssl rand -base64 32 | tr '+/' '-_')
          POSTGRES_PASSWORD=$(openssl rand -base64 24 | tr '+/' '-_')
          SARATI_URL=http://localhost:8080
          SARATI_PORT=8080
          LOG_LEVEL=debug
          PUBLIC_BASE_URL=https://hooks.example.com
          EOF
          docker compose up -d
      - name: A documented setting in .env must reach the service
        run: |
          # Booting proves the images run; it never proved configuration arrives. Without this,
          # a setting can be documented and unreachable at the same time.
          # A REAL value, not a sentinel: LOG_LEVEL is validated, so a junk probe crashed the
          # service at boot and proved nothing. `debug` differs from the default and still runs.
          got=$(docker compose exec -T service printenv LOG_LEVEL || true)
          test "$got" = 'debug' \
            || { echo "::error::.env settings do not reach the service (got '$got')"; exit 1; }
          docker compose exec -T service printenv DATABASE_URL | grep -q '@db:5432/sarati' \
            || { echo "::error::compose environment: no longer overrides .env"; exit 1; }
          # The one address the docs tell people to set apart (a tunnel for inbound webhooks): compose
          # used to overwrite it with SARATI_URL, which still owns the browser-facing origin.
          got=$(docker compose exec -T service printenv PUBLIC_BASE_URL || true)
          test "$got" = 'https://hooks.example.com' \
            || { echo "::error::PUBLIC_BASE_URL in .env does not reach the service (got '$got')"; exit 1; }
          got=$(docker compose exec -T service printenv FRONTEND_URL || true)
          test "$got" = 'http://localhost:8080' \
            || { echo "::error::FRONTEND_URL no longer follows SARATI_URL (got '$got')"; exit 1; }
          echo "config reaches the service, and compose still wins where it must"
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8080/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8080/api/auth/local/status | grep -q '"awaiting_bootstrap":true'
          curl -fsS http://localhost:8080/api/composer/status | grep -q '"status"'
          curl -fsS -o /dev/null http://localhost:8080/login
          echo "stack up: service, agent and client all reachable through the proxy"
      - name: The one-container install runs in production mode, on its own database and on yours
        run: |
          # Assembled FROM the images above, and ENV does not carry over: without its own
          # ENVIRONMENT=production a DATABASE_URL on another host is refused and the service never starts.
          test "$(docker compose exec -T agent printenv ENVIRONMENT)" = 'production' \
            || { echo "::error::the agent image does not run in production mode"; exit 1; }
          docker build -f docker/all-in-one/Dockerfile -t sarati-one:ci .
          ready() {
            for i in $(seq 1 90); do
              curl -fsS "http://localhost:$1/api/ready" >/dev/null 2>&1 && return 0
              sleep 2
            done
            echo "::error::$2"
            docker logs "$3" 2>&1 | tail -60
            return 1
          }
          docker run -d --name one-bundled -p 8093:8080 sarati-one:ci
          ready 8093 'the one-container install does not come up on its bundled database' one-bundled
          test "$(docker exec one-bundled printenv ENVIRONMENT)" = 'production'
          pw=$(openssl rand -hex 12)
          docker network create byo
          docker run -d --name byo-db --network byo --network-alias pg-elsewhere \
            -e POSTGRES_USER=sarati -e POSTGRES_PASSWORD="$pw" -e POSTGRES_DB=sarati postgres:16-alpine
          docker run -d --name one-byo --network byo -p 8094:8080 \
            -e DATABASE_URL="postgresql://sarati:$pw@pg-elsewhere:5432/sarati" sarati-one:ci
          ready 8094 'the one-container install does not come up on a Postgres of your own' one-byo
          echo "one-container install: production mode, on its bundled database and on your own"
      - if: failure()
        run: docker compose logs --no-color | tail -100
