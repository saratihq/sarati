; Five processes, one container. `autorestart=unexpected` plus `exitcodes=0` means a crash is
; retried and a clean exit is not; if any of them cannot stay up, the whole container should die
; rather than serve half a product — that is what `sarati-guard` enforces.
; `user=` only switches the uid: HOME stays root's unless set, and the composer keeps each
; conversation under $HOME — so every program that runs as node gets node's own HOME.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[program:postgres]
command=/usr/bin/postgres -D /data/postgres -c listen_addresses=127.0.0.1 -c unix_socket_directories=/tmp
user=postgres
priority=10
autorestart=unexpected
exitcodes=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:service]
; The entrypoint ends in `exec "$@"`, so the command its own image declares as CMD is passed here.
command=/usr/local/bin/entrypoint.sh node dist/main.js
directory=/opt/sarati/service
environment=PORT="8001",HOME="/home/node"
user=node
priority=20
autorestart=unexpected
exitcodes=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:agent]
command=node dist/main.js
directory=/opt/sarati/agent
environment=PORT="8010",HOME="/home/node"
user=node
priority=30
autorestart=unexpected
exitcodes=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:client]
command=node apps/client/server.js
directory=/opt/sarati/client
environment=PORT="3000",HOSTNAME="0.0.0.0",HOME="/home/node"
user=node
priority=30
autorestart=unexpected
exitcodes=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:caddy]
command=/usr/sbin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
user=root
priority=40
autorestart=unexpected
exitcodes=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
